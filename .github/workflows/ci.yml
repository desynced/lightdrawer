name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      # Offline suite only. npm test is `node scripts/build.mjs && node test/run.mjs`.
      # Do not run test/e2e_browser.py or `npm run test:live` here. Those need a
      # browser or the public timestamp services.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # ESLint on src/, scripts/, and test/ only. Still offline: no test:live, no browser.
      - name: Lint
        run: npm run lint
