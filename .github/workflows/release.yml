name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Package release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          mkdir -p dist
          # wrangler.jsonc in this archive is the committed template. It has
          # placeholders only. The private production config is not in git.
          tar -czf "dist/lightdrawer-${tag}.tar.gz" \
            public \
            build/core.js \
            src \
            migrations \
            schema \
            trust \
            package.json \
            package-lock.json \
            wrangler.jsonc \
            LICENSE \
            README.md \
            CHANGELOG.md
          cp public/verify.html dist/verify.html
          (
            cd dist
            sha256sum "lightdrawer-${tag}.tar.gz" verify.html > SHA256SUMS.txt
          )
          python3 - "$tag" CHANGELOG.md dist/notes.md <<'PY'
          import sys
          tag, src, dest = sys.argv[1:]
          ver = tag[1:] if tag.startswith("v") else tag
          lines = open(src, encoding="utf-8").read().splitlines()
          start = None
          for i, line in enumerate(lines):
              if line.startswith(f"## [{ver}]"):
                  start = i
                  break
          if start is None:
              notes = f"Release {tag}.\n\nNo matching section in CHANGELOG.md.\n"
          else:
              end = len(lines)
              for j in range(start + 1, len(lines)):
                  line = lines[j]
                  if line.startswith("## ") or (line.startswith("[") and "]: " in line):
                      end = j
                      break
              notes = "\n".join(lines[start:end]).strip() + "\n"
          open(dest, "w", encoding="utf-8").write(notes)
          PY

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/lightdrawer-${{ github.ref_name }}.tar.gz
            dist/verify.html
            dist/SHA256SUMS.txt

      # One Sigstore bundle covers every subject. Copy it to one name per file
      # so the same attestation is also a release asset. SHA256SUMS.txt stays a
      # checksum of the tarball and verify.html only.
      - name: Copy provenance bundles
        env:
          TAG: ${{ github.ref_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tag="$TAG"
          bundle="$BUNDLE_PATH"
          if [ -z "$bundle" ] || [ ! -f "$bundle" ] || [ ! -s "$bundle" ]; then
            echo "attest bundle-path is missing or empty" >&2
            exit 1
          fi
          cp "$bundle" "dist/lightdrawer-${tag}.tar.gz.intoto.jsonl"
          cp "$bundle" dist/verify.html.intoto.jsonl
          cp "$bundle" dist/SHA256SUMS.txt.intoto.jsonl

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          assets=(
            "dist/lightdrawer-${tag}.tar.gz"
            dist/SHA256SUMS.txt
            dist/verify.html
            "dist/lightdrawer-${tag}.tar.gz.intoto.jsonl"
            dist/verify.html.intoto.jsonl
            dist/SHA256SUMS.txt.intoto.jsonl
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file dist/notes.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --notes-file dist/notes.md
          fi
